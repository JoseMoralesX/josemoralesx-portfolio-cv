    <path d="M130 710 C340 510, 520 790, 740 590 C960 390, 1120 680, 1320 520 C1540 340, 1740 650, 1960 470 C2140 320, 2260 350, 2350 280"/>
  </g>

  <g stroke="#0b0b0f" stroke-opacity="0.14" fill="none">
    <rect x="260" y="150" width="560" height="360" rx="28"/>
    <rect x="910" y="210" width="620" height="420" rx="32"/>
    <rect x="1620" y="170" width="520" height="330" rx="28"/>
  </g>

  <g stroke="#0b0b0f" stroke-opacity="0.16" fill="none" stroke-width="2">
