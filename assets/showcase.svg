<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" role="img" aria-label="Abstract technology showcase">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0b0f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0b0b0f" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#0b0b0f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0b0b0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#0b0b0f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0b0b0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="2400" height="900" fill="url(#bg)"/>

  <g opacity="0.8">
